<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="sans-serif">
  <!-- 出任務：任務卡洗亂翻開
       上兩列 一般情況：全部成功 → 任務成功；有 1 張失敗 → 任務失敗
       下兩列 7 人以上的第 4 輪：1 張失敗仍算成功，要 2 張失敗才失敗 -->
  <defs>
    <g id="ok"><rect x="-14" y="-20" width="28" height="40" rx="5" fill="#3c9a4b" stroke="#fff" stroke-width="2"/><text y="7" text-anchor="middle" font-size="18" fill="#fff">✓</text></g>
    <g id="ng"><rect x="-14" y="-20" width="28" height="40" rx="5" fill="#d9534f" stroke="#fff" stroke-width="2"/><text y="7" text-anchor="middle" font-size="18" fill="#fff">✗</text></g>
    <g id="win"><circle r="20" fill="#3c9a4b"/><text y="9" text-anchor="middle" font-size="24" fill="#fff">✓</text></g>
    <g id="lose"><circle r="20" fill="#d9534f"/><text y="9" text-anchor="middle" font-size="24" fill="#fff">✗</text></g>
    <g id="person" fill="#6d7b8c"><circle cy="-9" r="6"/><path d="M-10 12 Q-10 -1 0 -1 Q10 -1 10 12Z"/></g>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#555"/></marker>
  </defs>
  <rect width="420" height="300" fill="#f4ecd8"/>

  <!-- 一般 -->
  <g transform="translate(0,40)">
    <use href="#ok" x="150"/><use href="#ok" x="186"/><use href="#ok" x="222"/>
    <line x1="252" y1="0" x2="320" y2="0" stroke="#555" stroke-width="3" marker-end="url(#ah)"/>
    <use href="#win" x="360"/>
  </g>
  <g transform="translate(0,100)">
    <use href="#ok" x="150"/><use href="#ng" x="186"/><use href="#ok" x="222"/>
    <line x1="252" y1="0" x2="320" y2="0" stroke="#555" stroke-width="3" marker-end="url(#ah)"/>
    <use href="#lose" x="360"/>
  </g>

  <!-- 7 人以上、第 4 輪 -->
  <rect x="12" y="148" width="396" height="140" rx="12" fill="#efe2c2" stroke="#b89a5a" stroke-width="2" stroke-dasharray="7 5"/>
  <g transform="translate(55,218)" text-anchor="middle">
    <circle cy="-30" r="18" fill="#e8b923" stroke="#8a6d10" stroke-width="1.5"/>
    <text y="-23" font-size="20" font-weight="bold" fill="#333">4</text>
    <use href="#person" x="-12" y="22"/>
    <text x="14" y="30" font-size="17" font-weight="bold" fill="#333">7+</text>
  </g>
  <g transform="translate(0,185)">
    <use href="#ok" x="132"/><use href="#ng" x="168"/><use href="#ok" x="204"/><use href="#ok" x="240"/>
    <line x1="268" y1="0" x2="320" y2="0" stroke="#555" stroke-width="3" marker-end="url(#ah)"/>
    <use href="#win" x="360"/>
  </g>
  <g transform="translate(0,250)">
    <use href="#ok" x="132"/><use href="#ng" x="168"/><use href="#ng" x="204"/><use href="#ok" x="240"/>
    <line x1="268" y1="0" x2="320" y2="0" stroke="#555" stroke-width="3" marker-end="url(#ah)"/>
    <use href="#lose" x="360"/>
  </g>
</svg>
