  <!-- 選角色（4 人）：8 張 → 蓋著拿掉 1、翻開拿掉 2（國王 4 不能翻開拿掉）→ 剩 5 張給王冠玩家，挑 1 張蓋著，其餘傳左手邊：4→3→2，最後 1 張不用 -->
  <defs>
    <g id="m" stroke="#fff" stroke-width="1.5"><circle cy="-10" r="5"/><path d="M-10 10 L-5 -2 L-10 -3 L-10 -6 L10 -6 L10 -3 L5 -2 L10 10 L3 10 L0 4 L-3 10Z"/></g>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#333"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#c0392b"/></marker>
    <g id="coin"><circle r="7" fill="#f2c230" stroke="#a87b00" stroke-width="1.5"/><circle r="3" fill="none" stroke="#a87b00" stroke-width="1"/></g>
