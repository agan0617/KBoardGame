<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 216" font-family="sans-serif">
  <!-- 上：王冠玩家從 1 叫到 8，有人拿的角色(2,4,5,8)依序行動，沒人拿的跳過。下：輪到你時 1 拿 2 金或抽 2 留 1，2 付費蓋 1 座（費用 3 付 3 金） -->
  <defs>
    <g id="m" stroke="#fff" stroke-width="1.5"><circle cy="-10" r="5"/><path d="M-10 10 L-5 -2 L-10 -3 L-10 -6 L10 -6 L10 -3 L5 -2 L10 10 L3 10 L0 4 L-3 10Z"/></g>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#333"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#c0392b"/></marker>
    <g id="coin"><circle r="7" fill="#f2c230" stroke="#a87b00" stroke-width="1.5"/><circle r="3" fill="none" stroke="#a87b00" stroke-width="1"/></g>
    <g id="bcard"><rect x="-8" y="-11" width="16" height="22" rx="2" fill="#fffaf0" stroke="#555" stroke-width="1.5"/><path d="M-4 3 L0 -2 L4 3 V7 H-4Z" fill="#999"/></g>
    <g id="back"><rect x="-14" y="-19" width="28" height="38" rx="4" fill="#7a3b2e" stroke="#fff" stroke-width="2"/><path d="M0 -10 L8 0 L0 10 L-8 0Z" fill="none" stroke="#c98a6b" stroke-width="2"/></g>
    <g id="crown"><path d="M-10 4 L-10 -6 L-5 -1 L0 -8 L5 -1 L10 -6 L10 4Z" fill="#e8c13a" stroke="#8a6d00" stroke-width="1.5"/></g>
    <g id="shield"><path d="M-8 -9 h16 v9 q0 9 -8 12 q-8 -3 -8 -12z" fill="#2f6fd0" stroke="#fff" stroke-width="1.5"/></g>
  </defs>
  <rect width="420" height="216" fill="#f4ecd8"/>
  <rect x="8" y="8" width="404" height="92" rx="10" fill="#fbf6ea" stroke="#d8cbb0" stroke-width="1.5"/>
  <use href="#crown" transform="translate(30,40) scale(1.3)"/>
  <line x1="50" y1="40" x2="405" y2="40" stroke="#333" stroke-width="2.5" marker-end="url(#ah)"/>
  <circle cx="70" cy="40" r="14" fill="#e3dccb" stroke="#bbb" stroke-width="2"/><text x="70" y="45" text-anchor="middle" font-size="15" fill="#aaa">1</text>
  <circle cx="114" cy="40" r="16" fill="#fff" stroke="#333" stroke-width="2.5"/><text x="114" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">2</text>
  <use href="#m" transform="translate(114,80) scale(1.2)" fill="#3c9a4b" opacity="1"/>
  <circle cx="158" cy="40" r="14" fill="#e3dccb" stroke="#bbb" stroke-width="2"/><text x="158" y="45" text-anchor="middle" font-size="15" fill="#aaa">3</text>
  <circle cx="202" cy="40" r="16" fill="#fff" stroke="#333" stroke-width="2.5"/><text x="202" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">4</text>
  <use href="#m" transform="translate(202,80) scale(1.2)" fill="#d9534f" opacity="1"/>
  <circle cx="246" cy="40" r="16" fill="#fff" stroke="#333" stroke-width="2.5"/><text x="246" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">5</text>
  <use href="#m" transform="translate(246,80) scale(1.2)" fill="#e08a1e" opacity="1"/>
  <circle cx="290" cy="40" r="14" fill="#e3dccb" stroke="#bbb" stroke-width="2"/><text x="290" y="45" text-anchor="middle" font-size="15" fill="#aaa">6</text>
  <circle cx="334" cy="40" r="14" fill="#e3dccb" stroke="#bbb" stroke-width="2"/><text x="334" y="45" text-anchor="middle" font-size="15" fill="#aaa">7</text>
  <circle cx="378" cy="40" r="16" fill="#fff" stroke="#333" stroke-width="2.5"/><text x="378" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">8</text>
  <use href="#m" transform="translate(378,80) scale(1.2)" fill="#2f6fd0" opacity="1"/>
  <rect x="8" y="108" width="404" height="100" rx="10" fill="#fbf6ea" stroke="#d8cbb0" stroke-width="1.5"/>
  <use href="#m" transform="translate(36,168) scale(1.6)" fill="#d9534f" opacity="1"/>
  <circle cx="70" cy="124" r="12" fill="#333"/><text x="70" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
  <use href="#coin" x="92" y="158"/><use href="#coin" x="110" y="158"/>
  <line x1="132" y1="140" x2="132" y2="196" stroke="#999" stroke-width="2"/>
  <use href="#bcard" x="152" y="158"/><use href="#bcard" x="176" y="158"/>
  <circle cx="152" cy="186" r="9" fill="#3c9a4b"/><path d="M147.5 186 L151 190 L157 182" fill="none" stroke="#fff" stroke-width="2.5"/>
  <path d="M170 180 L182 192 M182 180 L170 192" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <line x1="198" y1="160" x2="226" y2="160" stroke="#333" stroke-width="2.5" marker-end="url(#ah)"/>
  <circle cx="244" cy="124" r="12" fill="#333"/><text x="244" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
  <use href="#coin" x="256" y="160"/><use href="#coin" x="272" y="160"/><use href="#coin" x="288" y="160"/>
  <line x1="302" y1="160" x2="330" y2="160" stroke="#333" stroke-width="2.5" marker-end="url(#ah)"/>
  <g opacity="1"><path d="M346.5 186 V154.8 L366 136.60000000000002 L385.5 154.8 V186 Z" fill="#3c9a4b" stroke="#fff" stroke-width="1.5"/><text x="366" y="178.20000000000002" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff">3</text></g>

</svg>
