<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" font-family="sans-serif">
  <!-- 決鬥：攻擊者 1 放劍、防守者 2 放盾；3、4 把角色卡放在攻擊者那邊（劍），5 放在防守者那邊（盾），6 不放＝不參與
       劍 3 ＞ 盾 2 → 攻擊者這邊贏 -->
  <defs>
    <g id="p"><circle r="15" fill="#6d7b8c" stroke="#fff" stroke-width="2"/></g>
    <g id="sword"><path d="M0 -17 L3.5 -12 L3.5 5 L-3.5 5 L-3.5 -12Z" fill="#cfd6dc" stroke="#555" stroke-width="1.2"/><rect x="-9" y="5" width="18" height="4" rx="1.5" fill="#7a5530"/><rect x="-2" y="9" width="4" height="8" fill="#7a5530"/></g>
    <g id="shield"><path d="M-11 -14 h22 v11 q0 13 -11 17 q-11 -4 -11 -17z" fill="#2f6fd0" stroke="#fff" stroke-width="1.5"/></g>
    <g id="cS"><rect x="-19" y="-25" width="38" height="50" rx="5" fill="#f9e3c3" stroke="#c0392b" stroke-width="2.5"/><use href="#sword"/></g>
    <g id="cD"><rect x="-19" y="-25" width="38" height="50" rx="5" fill="#dde8f7" stroke="#2f6fd0" stroke-width="2.5"/><use href="#shield"/></g>
    <g id="empty"><rect x="-19" y="-25" width="38" height="50" rx="5" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/></g>
  </defs>
  <rect width="420" height="270" fill="#f4ecd8"/>
  <rect x="12" y="12" width="186" height="178" rx="14" fill="#f6dccf"/>
  <rect x="222" y="12" width="186" height="178" rx="14" fill="#d9e4f2"/>

  <!-- 攻擊者那邊 -->
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">
    <use href="#p" x="50" y="40"/><text x="50" y="45">1</text>
    <use href="#p" x="105" y="40"/><text x="105" y="45">3</text>
    <use href="#p" x="160" y="40"/><text x="160" y="45">4</text>
  </g>
  <rect x="26" y="66" width="48" height="60" rx="8" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <use href="#cS" x="50" y="96"/><use href="#cS" x="105" y="96"/><use href="#cS" x="160" y="96"/>
  <text x="105" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="#c0392b">3</text>

  <!-- 防守者那邊 -->
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">
    <use href="#p" x="280" y="40"/><text x="280" y="45">2</text>
    <use href="#p" x="345" y="40"/><text x="345" y="45">5</text>
  </g>
  <rect x="256" y="66" width="48" height="60" rx="8" fill="none" stroke="#2f6fd0" stroke-width="2.5"/>
  <use href="#cD" x="280" y="96"/><use href="#cD" x="345" y="96"/>
  <text x="312" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f6fd0">2</text>

  <text x="210" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">&gt;</text>
  <circle cx="160" cy="160" r="15" fill="#3c9a4b"/><text x="160" y="167" text-anchor="middle" font-size="18" fill="#fff">✓</text>

  <!-- 6 不參與 -->
  <g text-anchor="middle">
    <use href="#p" x="175" y="230"/><text x="175" y="235" font-size="14" font-weight="bold" fill="#fff">6</text>
    <use href="#empty" x="232" y="230"/>
    <text x="232" y="237" font-size="20" fill="#999">—</text>
  </g>
</svg>
