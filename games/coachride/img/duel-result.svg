<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" font-family="sans-serif">
  <!-- 決鬥結果：
       第 1 列 平手：攻擊者（1）從補給牌堆拿一張道具
       第 2 列 贏家（★）二選一：偷看輸家的職業（綠）和結社（灰 ?），或看輸家的道具（黃）並拿走一張
       第 3 列 輸家只有一張道具：贏家拿走它，再給輸家一張自己的道具補上 -->
  <defs>
    <g id="p"><circle r="16" fill="#6d7b8c" stroke="#fff" stroke-width="2"/></g>
    <g id="w"><circle r="16" fill="#6d7b8c" stroke="#3c9a4b" stroke-width="3.5"/><text y="-21" text-anchor="middle" font-size="16" fill="#e8b923">★</text></g>
    <g id="sword"><path d="M0 -14 L3 -10 L3 4 L-3 4 L-3 -10Z" fill="#cfd6dc" stroke="#555" stroke-width="1.2"/><rect x="-8" y="4" width="16" height="3.5" rx="1.5" fill="#7a5530"/><rect x="-2" y="7.5" width="4" height="7" fill="#7a5530"/></g>
    <g id="shield"><path d="M-10 -12 h20 v10 q0 11 -10 15 q-10 -4 -10 -15z" fill="#2f6fd0" stroke="#fff" stroke-width="1.5"/></g>
    <g id="item"><rect x="-13" y="-18" width="26" height="36" rx="4" fill="#e8c13a" stroke="#8a6d10" stroke-width="1.5"/><circle r="5" fill="#fff8d8"/></g>
    <g id="job"><rect x="-13" y="-18" width="26" height="36" rx="4" fill="#7fb069" stroke="#3f6b2a" stroke-width="1.5"/></g>
    <g id="soc"><rect x="-13" y="-18" width="26" height="36" rx="4" fill="#555" stroke="#222" stroke-width="1.5"/><text y="7" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">?</text></g>
    <g id="eye"><path d="M-15 0 Q0 -12 15 0 Q0 12 -15 0Z" fill="#fff" stroke="#333" stroke-width="2"/><circle r="4.5" fill="#333"/></g>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#555"/></marker>
  </defs>
  <rect width="420" height="330" fill="#f4ecd8"/>

  <!-- 第 1 列：平手 -->
  <g transform="translate(0,52)" text-anchor="middle">
    <use href="#sword" x="40"/><text x="62" y="8" font-size="20" font-weight="bold" fill="#c0392b">2</text>
    <text x="88" y="8" font-size="22" font-weight="bold" fill="#333">=</text>
    <text x="112" y="8" font-size="20" font-weight="bold" fill="#2f6fd0">2</text><use href="#shield" x="136"/>
    <!-- 補給牌堆 -->
    <use href="#item" x="214" y="4"/><use href="#item" x="218" y="0"/><use href="#item" x="222" y="-4"/>
    <line x1="244" y1="0" x2="300" y2="0" stroke="#555" stroke-width="3" marker-end="url(#ah)"/>
    <use href="#p" x="330"/><text x="330" y="5" font-size="14" font-weight="bold" fill="#fff">1</text>
  </g>
  <line x1="12" y1="98" x2="408" y2="98" stroke="#c9b98f" stroke-width="1.5"/>

  <!-- 第 2 列：二選一 -->
  <g transform="translate(0,170)" text-anchor="middle">
    <use href="#w" x="34"/>
    <!-- 選項 A：偷看職業＋結社 -->
    <rect x="62" y="-50" width="140" height="92" rx="10" fill="#efe2c2"/>
    <use href="#eye" x="132" y="-32"/>
    <use href="#job" x="114" y="12"/><use href="#soc" x="150" y="12"/>
    <text x="211" y="8" font-size="24" font-weight="bold" fill="#555">/</text>
    <!-- 選項 B：看道具拿一張 -->
    <rect x="220" y="-50" width="188" height="92" rx="10" fill="#efe2c2"/>
    <use href="#item" x="248" y="12"/><use href="#item" x="278" y="12"/>
    <use href="#item" x="316" y="-14"/>
    <rect x="303" y="-6" width="26" height="36" rx="4" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" transform="translate(0,0)"/>
    <path d="M330 -20 Q362 -36 382 -12" fill="none" stroke="#3c9a4b" stroke-width="3" marker-end="url(#ah)"/>
    <text x="388" y="12" font-size="18" fill="#e8b923">★</text>
  </g>
  <line x1="12" y1="232" x2="408" y2="232" stroke="#c9b98f" stroke-width="1.5"/>

  <!-- 第 3 列：輸家只有一張道具 -->
  <g transform="translate(0,285)" text-anchor="middle">
    <use href="#w" x="60"/>
    <use href="#item" x="110"/>
    <use href="#p" x="330"/>
    <use href="#item" x="280"/>
    <path d="M262 -12 Q195 -40 130 -12" fill="none" stroke="#3c9a4b" stroke-width="3" marker-end="url(#ah)"/>
    <path d="M130 12 Q195 40 262 12" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/>
    <text x="280" y="38" font-size="15" font-weight="bold" fill="#555">× 1</text>
  </g>
</svg>
