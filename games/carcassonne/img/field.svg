<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" font-family="sans-serif">
  <!-- 草地：農夫所在的草地碰到 2 座完成的城堡（跨兩片、城牆圍起來）→ 3 × 2 = 6 分；右上沒完成的城堡（往外開口）不算 -->
  <defs>
    <g id="field"><rect width="70" height="70" fill="#8cbf5f" stroke="#4f7a36" stroke-width="2"/></g>
    <g id="city2"><ellipse rx="26" ry="18" fill="#d9a566" stroke="#8a5a2b" stroke-width="2.5"/></g>
    <g id="farmer" fill="#4caf50" stroke="#fff" stroke-width="1.5"><ellipse rx="12" ry="5"/><circle cx="-14" cy="0" r="4.5"/></g>
  </defs>
  <rect width="420" height="190" fill="#f4ecd8"/>
  <g transform="translate(20,20)">
    <use href="#field"/><use href="#field" x="70"/><use href="#field" x="140"/>
    <use href="#field" y="70"/><use href="#field" x="70" y="70"/><use href="#field" x="140" y="70"/>
    <!-- 完成的城堡 A：跨左上、中上兩片 -->
    <use href="#city2" x="70" y="32"/>
    <!-- 完成的城堡 B：跨中下、右下兩片 -->
    <use href="#city2" x="140" y="108"/>
    <!-- 沒完成的城堡：右上那片的右邊，往外開口 -->
    <polygon points="210,8 210,62 182,48 182,22" fill="#d9a566" stroke="#8a5a2b" stroke-width="2"/>
    <use href="#farmer" x="60" y="105"/>
    <text x="70" y="38" text-anchor="middle" font-size="16">✓</text>
    <text x="140" y="114" text-anchor="middle" font-size="16">✓</text>
    <text x="198" y="40" text-anchor="middle" font-size="16" fill="#c0392b">✗</text>
  </g>
  <g transform="translate(330,95)" text-anchor="middle"><text font-size="18" fill="#333" y="-8">3 × 2</text><text y="26" font-size="32" font-weight="bold" fill="#c0392b">= 6</text></g>
</svg>
