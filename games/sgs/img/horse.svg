<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 275" font-family="sans-serif">
  <!-- 攻擊範圍與馬：距離 ≤ 攻擊範圍才能出殺
       上 對方裝 +1 馬：距離 2 + 1 = 3 → 沒裝武器（範圍 1，虛線空格）打不到 ✗，範圍 3 的武器打得到 ✓
       下 你裝 −1 馬：距離 2 − 1 = 1 → 沒裝武器也打得到 ✓ -->
  <defs>
    <g id="p"><circle r="18" fill="#6d7b8c" stroke="#fff" stroke-width="2"/></g>
    <g id="me"><circle r="20" fill="#2f6fd0" stroke="#fff" stroke-width="2.5"/><g fill="#fff"><circle cy="-6" r="5"/><path d="M-9 11 Q-9 0 0 0 Q9 0 9 11Z"/></g></g>
    <g id="sword"><g transform="scale(-1,1)"><rect x="-24" y="-3" width="32" height="6" fill="#9aa4ad" stroke="#555" stroke-width="1"/><path d="M-24 -3 L-30 0 L-24 3Z" fill="#9aa4ad" stroke="#555" stroke-width="1"/><rect x="8" y="-9" width="4" height="18" fill="#7a5530"/><rect x="12" y="-2.5" width="10" height="5" fill="#7a5530"/></g></g>
    <g id="empty"><rect x="-26" y="-12" width="48" height="24" rx="5" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5 4"/></g>
    <g id="rng"><circle r="12" fill="#e8b923" stroke="#8a6d10" stroke-width="1.5"/></g>
    <g id="yes"><circle r="14" fill="#3c9a4b"/><text y="6" text-anchor="middle" font-size="17" fill="#fff">✓</text></g>
    <g id="no"><circle r="14" fill="#d9534f"/><text y="6" text-anchor="middle" font-size="17" fill="#fff">✗</text></g>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#555"/></marker>
  </defs>
  <rect width="420" height="275" fill="#f4ecd8"/>

  <!-- 上：對方 +1 馬 -->
  <g transform="translate(0,48)" text-anchor="middle">
    <use href="#me" x="40"/>
    <line x1="64" y1="0" x2="144" y2="0" stroke="#555" stroke-width="3" marker-end="url(#ah)"/>
    <text x="102" y="-10" font-size="18" font-weight="bold" fill="#333">2</text>
    <use href="#p" x="172"/>
    <rect x="182" y="-32" width="30" height="20" rx="6" fill="#8a5a2b"/><text x="197" y="-16.5" font-size="14" font-weight="bold" fill="#fff">+1</text>
    <text x="300" y="8" font-size="21" fill="#333">2 + 1 = <tspan font-weight="bold" fill="#c0392b">3</tspan></text>
  </g>
  <g transform="translate(0,108)" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">
    <use href="#empty" x="106"/><use href="#rng" x="146"/><text x="146" y="5.5">1</text><use href="#no" x="184"/>
    <use href="#sword" x="244"/><use href="#rng" x="298"/><text x="298" y="5.5">3</text><use href="#yes" x="336"/>
  </g>
  <line x1="12" y1="142" x2="408" y2="142" stroke="#c9b98f" stroke-width="1.5"/>

  <!-- 下：自己 −1 馬 -->
  <g transform="translate(0,188)" text-anchor="middle">
    <use href="#me" x="40"/>
    <rect x="48" y="-34" width="30" height="20" rx="6" fill="#8a5a2b"/><text x="63" y="-18.5" font-size="14" font-weight="bold" fill="#fff">−1</text>
    <line x1="64" y1="0" x2="144" y2="0" stroke="#555" stroke-width="3" marker-end="url(#ah)"/>
    <text x="102" y="-10" font-size="18" font-weight="bold" fill="#333">2</text>
    <use href="#p" x="172"/>
    <text x="300" y="8" font-size="21" fill="#333">2 − 1 = <tspan font-weight="bold" fill="#3c9a4b">1</tspan></text>
  </g>
  <g transform="translate(0,246)" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">
    <use href="#empty" x="106"/><use href="#rng" x="146"/><text x="146" y="5.5">1</text><use href="#yes" x="184"/>
  </g>
</svg>
