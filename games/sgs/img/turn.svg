<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 285" font-family="sans-serif">
  <!-- 回合六階段：1 準備（技能時機★）→ 2 判定（翻牌堆頂看花色點數）→ 3 摸 2 張 → 4 出牌（殺只能 1 張）→ 5 棄牌 → 6 結束（技能時機★）
       下方放大第 5 階段：體力 3、手牌 5 張 → 棄 2 張，留 3 張 -->
  <defs>
    <g id="ph"><circle r="18" fill="#8a1f1f" stroke="#fff" stroke-width="2"/></g>
    <g id="card"><rect x="-11" y="-15" width="22" height="30" rx="3" fill="#fff" stroke="#555" stroke-width="1.5"/></g>
    <g id="back"><rect x="-11" y="-15" width="22" height="30" rx="3" fill="#2f4f7a" stroke="#fff" stroke-width="1.5"/></g>
    <g id="kill"><rect x="-11" y="-15" width="22" height="30" rx="3" fill="#fff" stroke="#555" stroke-width="1.5"/><line x1="-6" y1="9" x2="6" y2="-9" stroke="#c0392b" stroke-width="3.5"/></g>
    <g id="hp"><circle r="9" fill="#3c9a4b" stroke="#fff" stroke-width="1.5"/></g>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#555"/></marker>
  </defs>
  <rect width="420" height="285" fill="#f4ecd8"/>

  <!-- 六個階段 -->
  <g text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">
    <use href="#ph" x="35" y="36"/><text x="35" y="42">1</text>
    <use href="#ph" x="105" y="36"/><text x="105" y="42">2</text>
    <use href="#ph" x="175" y="36"/><text x="175" y="42">3</text>
    <use href="#ph" x="245" y="36"/><text x="245" y="42">4</text>
    <use href="#ph" x="315" y="36"/><text x="315" y="42">5</text>
    <use href="#ph" x="385" y="36"/><text x="385" y="42">6</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#ah)">
    <line x1="56" y1="36" x2="84" y2="36"/><line x1="126" y1="36" x2="154" y2="36"/><line x1="196" y1="36" x2="224" y2="36"/>
    <line x1="266" y1="36" x2="294" y2="36"/><line x1="336" y1="36" x2="364" y2="36"/>
  </g>

  <!-- 各階段的圖示 -->
  <g text-anchor="middle">
    <text x="35" y="104" font-size="24" fill="#e8b923">★</text>
    <!-- 2 判定：翻開牌堆頂 -->
    <use href="#back" x="96" y="96"/><use href="#card" x="112" y="90"/><text x="112" y="96" font-size="15" font-weight="bold" fill="#c0392b">?</text>
    <!-- 3 摸 2 張 -->
    <use href="#back" x="166" y="96"/><use href="#back" x="182" y="92"/>
    <text x="175" y="132" font-size="16" font-weight="bold" fill="#3c9a4b">+2</text>
    <!-- 4 出牌：殺 ×1 -->
    <use href="#kill" x="245" y="94"/>
    <text x="245" y="132" font-size="16" font-weight="bold" fill="#333">× 1</text>
    <!-- 5 棄牌 -->
    <use href="#card" x="309" y="96"/><use href="#card" x="321" y="92"/>
    <text x="315" y="132" font-size="16" font-weight="bold" fill="#c0392b">−</text>
    <text x="385" y="104" font-size="24" fill="#e8b923">★</text>
  </g>

  <!-- 第 5 階段放大：體力 3、手牌 5 → 棄 2 -->
  <rect x="12" y="152" width="396" height="120" rx="12" fill="#efe2c2" stroke="#b89a5a" stroke-width="2" stroke-dasharray="7 5"/>
  <g text-anchor="middle">
    <use href="#ph" x="42" y="212"/><text x="42" y="218" font-size="17" font-weight="bold" fill="#fff">5</text>
    <use href="#hp" x="90" y="212"/><use href="#hp" x="112" y="212"/><use href="#hp" x="134" y="212"/>
    <text x="112" y="248" font-size="16" font-weight="bold" fill="#3c9a4b">3</text>
    <line x1="152" y1="212" x2="168" y2="212" stroke="#999" stroke-width="2"/>
    <use href="#card" x="190" y="212"/><use href="#card" x="216" y="212"/><use href="#card" x="242" y="212"/>
    <g opacity="0.45"><use href="#card" x="280" y="212"/><use href="#card" x="306" y="212"/></g>
    <text x="280" y="219" font-size="18" fill="#d9534f">✗</text><text x="306" y="219" font-size="18" fill="#d9534f">✗</text>
    <text x="216" y="248" font-size="16" font-weight="bold" fill="#3c9a4b">3</text>
    <text x="293" y="248" font-size="16" font-weight="bold" fill="#c0392b">2</text>
    <text x="365" y="219" font-size="18" fill="#333">5 → 3</text>
  </g>
</svg>
