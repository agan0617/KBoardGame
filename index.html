<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K桌遊</title>
<meta name="theme-color" content="#14111f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <button id="back" class="icon hidden" aria-label="返回">‹</button>
  <h1 id="title">K桌遊</h1>
  <span id="ver"></span>
  <div id="langs"></div>
</header>

<main id="home" class="view hidden">
  <ul id="game-list"></ul>
</main>

<main id="game" class="view hidden">
  <nav id="tabs"></nav>

  <section id="rules" class="pane hidden">
    <div id="toc"></div>
    <div id="rules-body"></div>
  </section>

  <section id="host" class="pane hidden">
    <div id="options"></div>
    <div id="scripts" class="seg"></div>
    <div id="now">
      <p id="now-text"></p>
      <div id="wait"><div id="wait-fill"></div></div>
    </div>
    <div id="controls">
      <button id="prev" class="icon" aria-label="上一句">⏮</button>
      <button id="play" class="big"></button>
      <button id="next" class="icon" aria-label="下一句">⏭</button>
    </div>
    <div id="pace" class="seg small">
      <span data-i18n="pace"></span>
      <button data-pace="0.6" data-i18n="short"></button>
      <button data-pace="1" data-i18n="mid"></button>
      <button data-pace="1.6" data-i18n="long"></button>
    </div>
    <ol id="lines"></ol>
  </section>

  <section id="mode" class="pane hidden"></section>
</main>

<script src="js/version.js"></script>
<script src="js/modes/undercover.js"></script>
<script src="js/modes/bang.js"></script>
<script src="js/modes/sgs.js"></script>
<script src="js/modes/carcassonne.js"></script>
<script src="js/modes/catan.js"></script>
<script src="js/modes/puertorico.js"></script>
<script src="js/app.js"></script>
</body>
</html>
